{% extends "base.html" %}{% block content %}
<div class="grid module-1"><section class="panel panel--primary"><div class="panel__head"><h2>预算采信记录</h2><span class="panel__meta">M1 · {{ data.status|default('READY') }}</span></div><div class="panel__body panel__body--scroll"><table class="ledger"><thead><tr><th>字段</th><th>值</th><th>证据</th></tr></thead><tbody>{% for key, value in data.items() %}<tr><td>{{ key }}</td><td class="num">{{ value }}</td><td>R{{ loop.index }}</td></tr>{% endfor %}</tbody></table></div></section>
<div class="stack"><section class="panel"><div class="panel__head"><h2>原因码</h2><span class="panel__meta">{{ data.reason|default('OK') }}</span></div><div class="panel__body bars"><i style="--v:29%"></i><i style="--v:62%"></i></div></section><section class="panel"><div class="panel__head"><h2>本次动作</h2><span class="panel__meta">/api/budgets/import</span></div><div class="panel__body"><button class="btn btn--primary" data-endpoint="/api/budgets/import">运行 预算采信</button><pre class="result">等待运行</pre></div></section></div></div>
{% endblock %}
